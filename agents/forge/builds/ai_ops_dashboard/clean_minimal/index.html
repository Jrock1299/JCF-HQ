<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Ops Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Jura:wght@400;500;600;700&family=Chathura:wght@300;400;700;800&display=swap" rel="stylesheet">

<style>
/* ── CSS Custom Properties ─── */
:root {
  --color-bg: #ffffff;
  --color-card-bg: #f8fafc;
  --color-accent: #3b82f6;
  --color-accent-alt: #10b981;
  --color-text: #1e293b;
  --color-text-muted: #94a3b8;
  --color-border: #e2e8f0;
  --color-danger: #ef4444;
  --color-warning: #f59e0b;
  --font-display: 'Bungee Shade', cursive;
  --font-heading: 'Jura', sans-serif;
  --font-body: 'Chathura', sans-serif;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 15px rgba(0,0,0,0.06), 0 4px 6px rgba(0,0,0,0.04);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --transition: 0.2s ease;
}

/* ── Reset & Base ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button, input, select, textarea { font-family: inherit; }

html { font-size: 16px; }

body {
  font-family: var(--font-body);
  background: var(--color-bg);
  color: var(--color-text);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Loading Skeleton ─── */
#loading-screen {
  position: fixed;
  inset: 0;
  background: var(--color-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  transition: opacity 0.4s ease;
}
#loading-screen.hidden { opacity: 0; pointer-events: none; }

.loading-pulse {
  display: flex;
  gap: 8px;
  align-items: center;
}
.loading-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--color-accent);
  animation: pulse-dot 1.2s ease-in-out infinite;
}
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes pulse-dot {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

/* ── Main App ─── */
#app {
  opacity: 0;
  transition: opacity 0.5s ease;
}
#app.visible { opacity: 1; }

/* ── Layout ─── */
.container {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 32px;
}

/* ── Header ─── */
.header {
  background: var(--color-bg);
  border-bottom: 1px solid var(--color-border);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(8px);
}
.header-inner {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 32px;
  max-width: 1440px;
  margin: 0 auto;
}
.logo-placeholder {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--color-accent), #6366f1);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition);
}
.logo-placeholder:hover {
  transform: scale(1.05);
  box-shadow: 0 4px 12px rgba(59,130,246,0.3);
}

.title-input {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--color-text);
  border: none;
  background: transparent;
  outline: none;
  cursor: text;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  transition: background var(--transition);
  min-width: 200px;
}
.title-input:hover { background: var(--color-card-bg); }
.title-input:focus { background: var(--color-card-bg); }

.header-spacer { flex: 1; }

.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* ── Toggle Switch ─── */
.mode-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--color-card-bg);
  border: 1px solid var(--color-border);
  border-radius: 100px;
  padding: 4px;
}
.mode-btn {
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 100px;
  border: none;
  cursor: pointer;
  transition: all var(--transition);
  color: var(--color-text-muted);
  background: transparent;
}
.mode-btn.active {
  background: var(--color-accent);
  color: white;
  box-shadow: 0 2px 8px rgba(59,130,246,0.3);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}
.btn-primary {
  background: var(--color-accent);
  color: white;
}
.btn-primary:hover {
  background: #2563eb;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(59,130,246,0.3);
}
.btn-primary:active { transform: translateY(0); }

.btn-ghost {
  background: transparent;
  color: var(--color-text-muted);
  border: 1px solid var(--color-border);
}
.btn-ghost:hover {
  background: var(--color-card-bg);
  color: var(--color-text);
}

.btn-danger {
  background: transparent;
  color: var(--color-danger);
  border: 1px solid #fecaca;
}
.btn-danger:hover {
  background: #fef2f2;
}

/* ── Main Content ─── */
.main {
  padding: 32px;
  max-width: 1440px;
  margin: 0 auto;
}

/* ── Summary Row ─── */
.summary-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 32px;
}

.summary-card {
  background: var(--color-card-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--transition), transform var(--transition);
}
.summary-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.summary-label {
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font-heading);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--color-text-muted);
  margin-bottom: 8px;
}
.summary-value {
  font-size: 36px;
  font-weight: 800;
  color: var(--color-text);
  line-height: 1.1;
  margin-bottom: 4px;
}
.summary-sub {
  font-size: 13px;
  color: var(--color-text-muted);
}
.summary-accent { color: var(--color-accent); }
.summary-green { color: var(--color-accent-alt); }
.summary-red { color: var(--color-danger); }

/* ── Section Headers ─── */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.section-title {
  font-size: 20px;
  font-weight: 700;
  font-family: var(--font-heading);
  color: var(--color-text);
}
.section-sub {
  font-size: 14px;
  color: var(--color-text-muted);
  margin-top: 2px;
}

/* ── Platform Grid ─── */
.platforms-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

/* ── Platform Card ─── */
.platform-card {
  background: var(--color-card-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  transition: all 0.3s ease;
  animation: card-in 0.4s ease forwards;
}

@keyframes card-in {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.platform-card:hover {
  box-shadow: var(--shadow-lg);
  transform: translateY(-2px);
}

.platform-card.alert-critical {
  border-color: #fca5a5;
  box-shadow: 0 0 0 3px rgba(239,68,68,0.12), var(--shadow-md);
  animation: card-in 0.4s ease forwards, alert-pulse 2s ease-in-out infinite;
}

@keyframes alert-pulse {
  0%, 100% { box-shadow: 0 0 0 3px rgba(239,68,68,0.12), var(--shadow-md); }
  50% { box-shadow: 0 0 0 6px rgba(239,68,68,0.08), var(--shadow-lg); }
}

.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 16px;
}
.platform-info {
  display: flex;
  align-items: center;
  gap: 12px;
}
.platform-icon {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 800;
  flex-shrink: 0;
  letter-spacing: -0.5px;
}
.platform-name {
  font-size: 15px;
  font-weight: 700;
  font-family: var(--font-heading);
  color: var(--color-text);
}
.platform-type {
  font-size: 13px;
  font-family: var(--font-heading);
  color: var(--color-text-muted);
  margin-top: 1px;
}

.card-actions {
  display: flex;
  gap: 4px;
}
.icon-btn {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  color: var(--color-text-muted);
  transition: all var(--transition);
  font-size: 13px;
}
.icon-btn:hover {
  background: var(--color-border);
  color: var(--color-text);
}
.icon-btn.danger:hover {
  background: #fef2f2;
  color: var(--color-danger);
}

/* ── Usage Bar ─── */
.usage-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.usage-label {
  font-size: 13px;
  color: var(--color-text-muted);
}
.usage-percent {
  font-size: 14px;
  font-weight: 600;
  color: var(--color-text);
}
.usage-percent.critical { color: var(--color-danger); }

.progress-track {
  height: 6px;
  background: var(--color-border);
  border-radius: 100px;
  overflow: hidden;
  margin-bottom: 12px;
}
.progress-fill {
  height: 100%;
  border-radius: 100px;
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}
.progress-fill::after {
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 30%;
  background: linear-gradient(to right, transparent, rgba(255,255,255,0.3));
  border-radius: 100px;
}
.progress-fill.normal { background: linear-gradient(to right, var(--color-accent), #60a5fa); }
.progress-fill.warning { background: linear-gradient(to right, var(--color-warning), #fbbf24); }
.progress-fill.critical { background: linear-gradient(to right, var(--color-danger), #f87171); }

.cost-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.cost-spent {
  font-size: 20px;
  font-weight: 700;
  color: var(--color-text);
}
.cost-budget {
  font-size: 13px;
  color: var(--color-text-muted);
}

/* ── Token Mode ─── */
.token-details {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--color-border);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.token-stat {
  background: var(--color-bg);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
}
.token-stat-label {
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--color-text-muted);
  margin-bottom: 2px;
}
.token-stat-value {
  font-size: 14px;
  font-weight: 700;
  color: var(--color-text);
}

/* ── Bottom Row ─── */
.bottom-row {
  display: grid;
  grid-template-columns: 1fr 400px;
  gap: 16px;
}

/* ── Chart Card ─── */
.chart-card {
  background: var(--color-card-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow-sm);
}
#spend-chart {
  width: 100%;
  margin-top: 16px;
}

/* ── Alerts Panel ─── */
.alerts-card {
  background: var(--color-card-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow-sm);
}
.alert-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 16px;
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  transition: background var(--transition);
}
.alert-item:last-child { margin-bottom: 0; }
.alert-item.critical {
  background: #fef2f2;
  border: 1px solid #fecaca;
}
.alert-item.warning {
  background: #fffbeb;
  border: 1px solid #fde68a;
}
.alert-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 3px;
}
.alert-dot.critical { background: var(--color-danger); }
.alert-dot.warning { background: var(--color-warning); }
.alert-text { font-size: 15px; color: var(--color-text); font-weight: 600; }
.alert-sub { font-size: 14px; color: var(--color-text-muted); margin-top: 2px; }
.no-alerts {
  text-align: center;
  padding: 24px;
  color: var(--color-text-muted);
  font-size: 13px;
}
.no-alerts-icon { font-size: 32px; margin-bottom: 8px; }

/* ── Modal ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(4px);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  padding: 16px;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}
.modal {
  background: var(--color-bg);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 32px;
  width: 100%;
  max-width: 480px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.12);
  transform: translateY(16px) scale(0.98);
  transition: transform 0.2s ease;
}
.modal-overlay.open .modal {
  transform: translateY(0) scale(1);
}
.modal-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 24px;
  color: var(--color-text);
}
.form-group {
  margin-bottom: 16px;
}
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--color-text-muted);
  margin-bottom: 6px;
}
.form-input, .form-select {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--color-text);
  background: var(--color-card-bg);
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.form-input:focus, .form-select:focus {
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 24px;
}

/* ── Color Picker for Icon ─── */
.color-options {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.color-option {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all var(--transition);
}
.color-option.selected {
  border-color: var(--color-text);
  transform: scale(1.1);
}

/* ── Empty State ─── */
.empty-state {
  text-align: center;
  padding: 64px 32px;
  color: var(--color-text-muted);
  grid-column: 1 / -1;
}
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-title { font-size: 18px; font-weight: 600; color: var(--color-text); margin-bottom: 8px; }
.empty-sub { font-size: 14px; margin-bottom: 24px; }

/* ── Responsive ─── */
@media (max-width: 1024px) {
  .summary-row { grid-template-columns: repeat(2, 1fr); }
  .bottom-row { grid-template-columns: 1fr; }
}

@media (max-width: 768px) {
  .container, .main { padding: 16px; }
  .header-inner { padding: 12px 16px; }
  .summary-row { grid-template-columns: 1fr; }
  .platforms-grid { grid-template-columns: 1fr; }
  .summary-value { font-size: 28px; }
  .form-row { grid-template-columns: 1fr; }
  .mode-toggle { display: none; }
  .bottom-row { grid-template-columns: 1fr; }
}

@media (max-width: 480px) {
  .header-actions .btn span { display: none; }
  .title-input { font-size: 15px; }
}

/* ── Colorway Switcher ── */
#cw-fab {
  position: fixed; bottom: 24px; right: 24px; z-index: 900;
  display: flex; align-items: center; gap: 8px;
  padding: 9px 18px; border-radius: 10px;
  background: white; border: 2px solid var(--color-accent);
  color: var(--color-accent); cursor: pointer;
  font-family: var(--font-body); font-size: 13px; font-weight: 700;
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  transition: all 0.2s ease;
}
#cw-fab:hover { background: var(--color-accent); color: white; }
#cw-panel {
  position: fixed; bottom: 76px; right: 24px; z-index: 899;
  width: 296px;
  background: white; border: 1px solid var(--color-border);
  border-radius: 16px; padding: 20px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.12);
  transform: translateY(10px) scale(0.97); opacity: 0; pointer-events: none;
  transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
}
#cw-panel.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: all; }
.cw-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cw-title { font-family: var(--font-heading); font-size: 12px; font-weight: 700; color: var(--color-text); text-transform: uppercase; letter-spacing: 0.8px; }
.cw-close { background: none; border: none; cursor: pointer; color: var(--color-text-muted); font-size: 18px; line-height: 1; padding: 0; }
.cw-close:hover { color: var(--color-text); }
#cw-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 14px; }
.cw-swatch {
  border: 2px solid transparent; border-radius: 10px; padding: 8px 6px;
  cursor: pointer; text-align: center; background: var(--color-card-bg);
  transition: all 0.2s ease;
}
.cw-swatch:hover { border-color: var(--color-accent); transform: scale(1.04); }
.cw-swatch.active { border-color: var(--color-accent); }
.cw-dots { display: flex; gap: 4px; justify-content: center; margin-bottom: 5px; }
.cw-dot { width: 16px; height: 16px; border-radius: 50%; }
.cw-label { font-size: 9px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-family: var(--font-body); }
.cw-custom {
  border-top: 1px solid var(--color-border); padding-top: 12px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.cw-custom label { font-size: 10px; color: var(--color-text-muted); font-family: var(--font-body); white-space: nowrap; }
.cw-custom input[type="color"] { width: 30px; height: 26px; border: 1px solid var(--color-border); border-radius: 6px; background: none; cursor: pointer; padding: 1px; }
.cw-apply { flex: 1; padding: 6px 10px; background: var(--color-accent); color: white; border: none; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: var(--font-body); transition: opacity 0.2s; }
.cw-apply:hover { opacity: 0.85; }

/* ── Tooltip ─── */
.tooltip-wrap { position: relative; }
.tooltip {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--color-text);
  color: white;
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 4px;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
}
.tooltip-wrap:hover .tooltip { opacity: 1; }
</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loading-screen">
  <div class="loading-pulse">
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
  </div>
</div>

<!-- App -->
<div id="app">

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo-placeholder" id="logo-placeholder" title="Your Brand">AI</div>

<script>
/* ── Storage & State ─── */
const STORAGE_KEY = 'aiops_minimal_v1';
const HISTORY_KEY = 'aiops_history_v1';
const META_KEY = 'aiops_meta_v1';

let state = {
  platforms: [],
  mode: 'subscription',
  title: 'AI Ops Dashboard'
};

let history6 = [];
let selectedColor = '#3b82f6';

/* ── Default Platforms ─── */
const DEFAULT_PLATFORMS = [
  { id: uid(), name: 'Claude', type: 'LLM', budget: 50, spend: 31.20, tokens: 1560, tokenCost: 0.020, color: '#f59e0b', initials: 'CL' },
  { id: uid(), name: 'ChatGPT', type: 'LLM', budget: 40, spend: 28.50, tokens: 3800, tokenCost: 0.0075, color: '#10b981', initials: 'GP' },
  { id: uid(), name: 'Gemini', type: 'LLM', budget: 30, spend: 8.90, tokens: 890, tokenCost: 0.010, color: '#3b82f6', initials: 'GM' },
  { id: uid(), name: 'Grok', type: 'LLM', budget: 25, spend: 20.10, tokens: 2010, tokenCost: 0.010, color: '#64748b', initials: 'GR' },
  { id: uid(), name: 'Perplexity', type: 'Search AI', budget: 20, spend: 20.00, tokens: 0, tokenCost: 0, color: '#06b6d4', initials: 'PP' },
  { id: uid(), name: 'Midjourney', type: 'Image AI', budget: 30, spend: 30.00, tokens: 0, tokenCost: 0, color: '#8b5cf6', initials: 'MJ' },
  { id: uid(), name: 'ElevenLabs', type: 'Audio AI', budget: 22, spend: 11.00, tokens: 0, tokenCost: 0, color: '#ec4899', initials: 'EL' },
];

function uid() {
  return 'p_' + Math.random().toString(36).substr(2, 9);
}

/* ── Load/Save ─── */
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      state = { ...state, ...saved };
    } else {
      state.platforms = DEFAULT_PLATFORMS;
      saveState();
    }
    const rawH = localStorage.getItem(HISTORY_KEY);
    if (rawH) {
      history6 = JSON.parse(rawH);
    } else {
      history6 = generateDefaultHistory();
      saveHistory();
    }
  } catch(e) {
    state.platforms = DEFAULT_PLATFORMS;
    history6 = generateDefaultHistory();
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function saveHistory() {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history6));
}

function generateDefaultHistory() {
  const now = new Date();
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const label = d.toLocaleString('default', { month: 'short' });
    const amount = i === 0
      ? state.platforms.reduce((s, p) => s + p.spend, 0)
      : Math.round((80 + Math.random() * 80) * 100) / 100;
    months.push({ label, amount });
  }
  return months;
}

/* ── Date Helpers ─── */
function getDaysInMonth() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
}
function getDayOfMonth() {
  return new Date().getDate();
}
function getDaysRemaining() {
  return getDaysInMonth() - getDayOfMonth();
}

/* ── Calculations ─── */
function calcTotalSpend() {
  return state.platforms.reduce((s, p) => s + p.spend, 0);
}
function calcTotalBudget() {
  return state.platforms.reduce((s, p) => s + p.budget, 0);
}
function calcProjected() {
  const total = calcTotalSpend();
  const day = getDayOfMonth();
  if (day === 0) return total;
  const dailyRate = total / day;
  return dailyRate * getDaysInMonth();
}
function calcPct(spend, budget) {
  if (!budget) return 0;
  return Math.min((spend / budget) * 100, 100);
}

/* ── Render ─── */
function render() {
  renderSummary();
  renderPlatforms();
  renderAlerts();
  renderChart();
  updateModeUI();
}

function renderSummary() {
  const spend = calcTotalSpend();
  const budget = calcTotalBudget();
  const projected = calcProjected();
  const remaining = budget - spend;

  document.getElementById('total-spend').textContent = fmt(spend);
  document.getElementById('total-sub').textContent = `Across ${state.platforms.length} platform${state.platforms.length !== 1 ? 's' : ''}`;
  document.getElementById('total-budget').textContent = fmt(budget);
  document.getElementById('budget-remaining').textContent = `${fmt(Math.max(0, remaining))} remaining`;

  const projEl = document.getElementById('projected-spend');
  projEl.textContent = fmt(projected);
  projEl.className = 'summary-value';
  if (projected > budget) {
    projEl.classList.add('summary-red');
  } else {
    projEl.classList.add('summary-accent');
  }

  const daysLeft = getDaysRemaining();
  document.getElementById('projection-sub').textContent =
    `${daysLeft} day${daysLeft !== 1 ? 's' : ''} remaining this month`;

  document.getElementById('platform-count-label').textContent =
    `${state.platforms.length} active platform${state.platforms.length !== 1 ? 's' : ''}`;

  // Update history current month
  if (history6.length > 0) {
    history6[history6.length - 1].amount = spend;
    saveHistory();
  }
}

function renderPlatforms() {
  const grid = document.getElementById('platforms-grid');
  grid.innerHTML = '';

  if (state.platforms.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🤖</div>
        <div class="empty-title">No platforms yet</div>
        <div class="empty-sub">Add your first AI platform to start tracking costs</div>
        <button class="btn btn-primary" onclick="openModal()">Add Platform</button>
      </div>`;
    return;
  }

  state.platforms.forEach((p, idx) => {
    const pct = calcPct(p.spend, p.budget);
    const isCritical = pct >= 80;
    const isWarning = pct >= 60 && pct < 80;
    const fillClass = isCritical ? 'critical' : (isWarning ? 'warning' : 'normal');
    const initials = p.initials || p.name.substring(0, 2).toUpperCase();

    let tokenHTML = '';
    if (state.mode === 'api') {
      const tokenSpend = p.tokens && p.tokenCost ? (p.tokens * p.tokenCost).toFixed(2) : '—';
      tokenHTML = `
        <div class="token-details">
          <div class="token-stat">
            <div class="token-stat-label">Tokens (K)</div>
            <div class="token-stat-value">${p.tokens ? numFmt(p.tokens) : '—'}</div>
          </div>
          <div class="token-stat">
            <div class="token-stat-label">Per 1K Tokens</div>
            <div class="token-stat-value">${p.tokenCost ? '$' + p.tokenCost.toFixed(4) : '—'}</div>
          </div>
          <div class="token-stat">
            <div class="token-stat-label">Token Cost</div>
            <div class="token-stat-value">${p.tokens && p.tokenCost ? '$' + tokenSpend : '—'}</div>
          </div>
          <div class="token-stat">
            <div class="token-stat-label">Daily Avg</div>
            <div class="token-stat-value">${fmt(p.spend / Math.max(getDayOfMonth(), 1))}</div>
          </div>
        </div>`;
    }

    const card = document.createElement('div');
    card.className = `platform-card${isCritical ? ' alert-critical' : ''}`;
    card.style.animationDelay = `${idx * 0.05}s`;
    card.innerHTML = `
      <div class="card-header">
        <div class="platform-info">
          <div class="platform-icon" style="background:${hexToRgba(p.color, 0.12)};color:${p.color};">${initials}</div>
          <div>
            <div class="platform-name">${escHtml(p.name)}</div>
            <div class="platform-type">${escHtml(p.type)}${isCritical ? ' • <span style="color:var(--color-danger);font-weight:600;">⚠ Over 80%</span>' : ''}</div>
          </div>
        </div>
        <div class="card-actions">
          <button class="icon-btn" onclick="openModal('${p.id}')" title="Edit">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M9.5 1.5L11.5 3.5L4.5 10.5H2.5V8.5L9.5 1.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn danger" onclick="deletePlatform('${p.id}')" title="Delete">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 3h9M5 3V2h3v1M3.5 3l.5 7.5a.5.5 0 00.5.5h4a.5.5 0 00.5-.5L9.5 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="usage-row">
        <span class="usage-label">${fmt(p.spend)} of ${fmt(p.budget)}</span>
        <span class="usage-percent${isCritical ? ' critical' : ''}">${pct.toFixed(0)}%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill ${fillClass}" style="width:0%" data-target="${pct}"></div>
      </div>
      <div class="cost-row">
        <span class="cost-spent">${fmt(p.spend)}</span>
        <span class="cost-budget">/ ${fmt(p.budget)} budget</span>
      </div>
      ${tokenHTML}
    `;
    grid.appendChild(card);
  });

  // Animate progress bars
  requestAnimationFrame(() => {
    document.querySelectorAll('.progress-fill').forEach(bar => {
      const target = bar.dataset.target;
      setTimeout(() => { bar.style.width = target + '%'; }, 100);
    });
  });
}

function renderAlerts() {
  const list = document.getElementById('alerts-list');
  const badge = document.getElementById('alert-badge');
  list.innerHTML = '';

  const critical = state.platforms.filter(p => calcPct(p.spend, p.budget) >= 80);
  const warning = state.platforms.filter(p => {
    const pct = calcPct(p.spend, p.budget);
    return pct >= 60 && pct < 80;
  });

  const total = critical.length + warning.length;
  if (total === 0) {
    badge.style.display = 'none';
    list.innerHTML = `
      <div class="no-alerts">
        <div class="no-alerts-icon">✅</div>
        All platforms within budget
      </div>`;
    return;
  }

  badge.style.display = 'inline-block';
  badge.textContent = total;

  critical.forEach(p => {
    const pct = calcPct(p.spend, p.budget);
    list.innerHTML += `
      <div class="alert-item critical">
        <div class="alert-dot critical"></div>
        <div>
          <div class="alert-text">${escHtml(p.name)} — ${pct.toFixed(0)}% used</div>
          <div class="alert-sub">${fmt(p.spend)} of ${fmt(p.budget)} budget spent</div>
        </div>
      </div>`;
  });

  warning.forEach(p => {
    const pct = calcPct(p.spend, p.budget);
    list.innerHTML += `
      <div class="alert-item warning">
        <div class="alert-dot warning"></div>
        <div>
          <div class="alert-text">${escHtml(p.name)} — ${pct.toFixed(0)}% used</div>
          <div class="alert-sub">${fmt(p.spend)} of ${fmt(p.budget)} budget spent</div>
        </div>
      </div>`;
  });
}

/* ── Chart ─── */
function renderChart() {
  const canvas = document.getElementById('spend-chart');
  const container = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const W = container.clientWidth - 48;
  const H = 300;

  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  if (!history6 || history6.length === 0) return;

  const padL = 56, padR = 16, padT = 24, padB = 48;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;

  const maxVal = Math.max(...history6.map(h => h.amount), 1);
  const barW = (chartW / history6.length) * 0.55;
  const gap = (chartW / history6.length) * 0.45;

  // Grid lines
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = padT + (chartH / 4) * i;
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + chartW, y);
    ctx.stroke();

    const val = maxVal - (maxVal / 4) * i;
    ctx.fillStyle = '#94a3b8';
    ctx.font = '14px Chathura';
    ctx.textAlign = 'right';
    ctx.fillText('$' + val.toFixed(0), padL - 6, y + 3.5);
  }

  // Bars
  history6.forEach((h, i) => {
    const x = padL + i * (chartW / history6.length) + gap / 2;
    const barH = (h.amount / maxVal) * chartH;
    const y = padT + chartH - barH;

    const isLast = i === history6.length - 1;
    const grad = ctx.createLinearGradient(0, y, 0, padT + chartH);
    if (isLast) {
      grad.addColorStop(0, '#3b82f6');
      grad.addColorStop(1, '#bfdbfe');
    } else {
      grad.addColorStop(0, '#cbd5e1');
      grad.addColorStop(1, '#e2e8f0');
    }
    ctx.fillStyle = grad;

    const r = 4;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + barW - r, y);
    ctx.quadraticCurveTo(x + barW, y, x + barW, y + r);
    ctx.lineTo(x + barW, padT + chartH);
    ctx.lineTo(x, padT + chartH);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
    ctx.fill();

    // Value label
    if (isLast) {
      ctx.fillStyle = '#3b82f6';
      ctx.font = '700 16px Chathura';
      ctx.textAlign = 'center';
      ctx.fillText('$' + h.amount.toFixed(0), x + barW / 2, y - 5);
    }

    // X label
    ctx.fillStyle = '#94a3b8';
    ctx.font = isLast ? '600 14px Chathura' : '400 14px Chathura';
    ctx.fillStyle = isLast ? '#1e293b' : '#94a3b8';
    ctx.textAlign = 'center';
    ctx.fillText(h.label, x + barW / 2, H - 10);
  });
}

/* ── Mode ─── */
function setMode(m) {
  state.mode = m;
  saveState();
  updateModeUI();
  renderPlatforms();
}

function updateModeUI() {
  document.getElementById('mode-sub').classList.toggle('active', state.mode === 'subscription');
  document.getElementById('mode-api').classList.toggle('active', state.mode === 'api');
  document.getElementById('token-fields').style.display = state.mode === 'api' ? 'block' : 'none';
}

/* ── Modal ─── */
let editingId = null;

function openModal(id) {
  editingId = id || null;
  const modal = document.getElementById('modal-overlay');
  const form = document.getElementById('platform-form');
  form.reset();
  selectedColor = '#3b82f6';
  resetColorSelection('#3b82f6');

  updateModeUI();

  if (id) {
    const p = state.platforms.find(x => x.id === id);
    if (!p) return;
    document.getElementById('modal-title').textContent = 'Edit Platform';
    document.getElementById('form-submit-btn').textContent = 'Save Changes';
    document.getElementById('edit-id').value = id;
    document.getElementById('field-name').value = p.name;
    document.getElementById('field-type').value = p.type;
    document.getElementById('field-budget').value = p.budget;
    document.getElementById('field-spend').value = p.spend;
    document.getElementById('field-tokens').value = p.tokens || '';
    document.getElementById('field-token-cost').value = p.tokenCost || '';
    selectedColor = p.color;
    resetColorSelection(p.color);
  } else {
    document.getElementById('modal-title').textContent = 'Add Platform';
    document.getElementById('form-submit-btn').textContent = 'Add Platform';
  }

  modal.classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function handleFormSubmit(e) {
  e.preventDefault();
  const name = document.getElementById('field-name').value.trim();
  const type = document.getElementById('field-type').value;
  const budget = parseFloat(document.getElementById('field-budget').value) || 0;
  const spend = parseFloat(document.getElementById('field-spend').value) || 0;
  const tokens = parseFloat(document.getElementById('field-tokens').value) || 0;
  const tokenCost = parseFloat(document.getElementById('field-token-cost').value) || 0;
  const initials = name.substring(0, 2).toUpperCase();

  if (editingId) {
    const idx = state.platforms.findIndex(p => p.id === editingId);
    if (idx !== -1) {
      state.platforms[idx] = { ...state.platforms[idx], name, type, budget, spend, tokens, tokenCost, color: selectedColor, initials };
    }
  } else {
    state.platforms.push({ id: uid(), name, type, budget, spend, tokens, tokenCost, color: selectedColor, initials });
  }

  saveState();
  closeModal();
  render();
}

function deletePlatform(id) {
  if (!confirm('Remove this platform?')) return;
  state.platforms = state.platforms.filter(p => p.id !== id);
  saveState();
  render();
}

function selectColor(el, color) {
  selectedColor = color;
  resetColorSelection(color);
}

function resetColorSelection(color) {
  document.querySelectorAll('.color-option').forEach(opt => {
    opt.classList.toggle('selected', opt.dataset.color === color);
  });
}

/* ── Title & Logo ─── */
document.getElementById('dashboard-title').addEventListener('input', e => {
  state.title = e.target.value;
  saveState();
});

document.getElementById('logo-placeholder').addEventListener('click', () => {
  const name = document.getElementById('dashboard-title').value;
  document.getElementById('logo-placeholder').textContent = name.substring(0, 2).toUpperCase() || 'AI';
});

/* ── Helpers ─── */
function fmt(n) {
  return '$' + (n || 0).toFixed(2);
}
function numFmt(n) {
  return n >= 1000 ? (n / 1000).toFixed(1) + 'K' : n;
}
function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ── Colorway Switcher ── */
const COLORWAY_KEY = 'aiops_minimal_v1_colorway';
const COLORWAYS_MINIMAL = [
  { name: 'Blue',     bg: '#ffffff', card: '#f8fafc', accent: '#3b82f6', accentAlt: '#10b981', border: '#e2e8f0', text: '#1e293b', muted: '#94a3b8' },
  { name: 'Sage',     bg: '#f0fdf4', card: '#f7fef9', accent: '#22c55e', accentAlt: '#16a34a', border: '#bbf7d0', text: '#14532d', muted: '#6a9a7a' },
  { name: 'Coral',    bg: '#fff7ed', card: '#fef9f5', accent: '#f97316', accentAlt: '#ea580c', border: '#fed7aa', text: '#431407', muted: '#9a6040' },
  { name: 'Lavender', bg: '#faf5ff', card: '#f5effe', accent: '#8b5cf6', accentAlt: '#7c3aed', border: '#e9d5ff', text: '#3b0764', muted: '#7c6a9a' },
  { name: 'Slate',    bg: '#f8fafc', card: '#f1f5f9', accent: '#64748b', accentAlt: '#475569', border: '#e2e8f0', text: '#0f172a', muted: '#94a3b8' },
];

function toggleColorwayPanel() {
  document.getElementById('cw-panel').classList.toggle('open');
}

function applyColorway(cw, idx, save) {
  const r = document.documentElement;
  r.style.setProperty('--color-bg', cw.bg);
  r.style.setProperty('--color-card-bg', cw.card);
  r.style.setProperty('--color-accent', cw.accent);
  r.style.setProperty('--color-accent-alt', cw.accentAlt);
  r.style.setProperty('--color-border', cw.border);
  r.style.setProperty('--color-text', cw.text);
  r.style.setProperty('--color-text-muted', cw.muted);
  document.querySelectorAll('.cw-swatch').forEach((s, i) => s.classList.toggle('active', i === idx));
  if (save !== false) try { localStorage.setItem(COLORWAY_KEY, idx); } catch(e) {}
  setTimeout(() => { try { renderChart(); } catch(e) {} }, 100);
}

function applyCustomColorway() {
  const accent = document.getElementById('cw-accent-pick').value;
  const r = document.documentElement;
  r.style.setProperty('--color-accent', accent);
  document.querySelectorAll('.cw-swatch').forEach(s => s.classList.remove('active'));
  try { localStorage.setItem(COLORWAY_KEY, 'custom:' + accent); } catch(e) {}
  setTimeout(() => { try { renderChart(); } catch(e) {} }, 100);
}

(function initColorwaySwitcher() {
  const grid = document.getElementById('cw-grid');
  COLORWAYS_MINIMAL.forEach((cw, i) => {
    const s = document.createElement('div');
    s.className = 'cw-swatch' + (i === 0 ? ' active' : '');
    s.title = cw.name;
    s.innerHTML = `<div class="cw-dots"><div class="cw-dot" style="background:${cw.bg};border:1px solid #ccc"></div><div class="cw-dot" style="background:${cw.accent}"></div></div><div class="cw-label">${cw.name}</div>`;
    s.addEventListener('click', () => applyColorway(cw, i));
    grid.appendChild(s);
  });
  try {
    const saved = localStorage.getItem(COLORWAY_KEY);
    if (saved !== null) {
      if (saved.startsWith('custom:')) {
        document.getElementById('cw-accent-pick').value = saved.split(':')[1];
        applyCustomColorway();
      } else {
        const idx = parseInt(saved);
        if (!isNaN(idx) && COLORWAYS_MINIMAL[idx]) applyColorway(COLORWAYS_MINIMAL[idx], idx, false);
      }
    }
  } catch(e) {}
  document.addEventListener('click', e => {
    const panel = document.getElementById('cw-panel');
    const fab = document.getElementById('cw-fab');
    if (panel && panel.classList.contains('open') && !panel.contains(e.target) && fab && !fab.contains(e.target)) {
      panel.classList.remove('open');
    }
  });
})();

/* ── Resize ─── */
window.addEventListener('resize', () => {
  renderChart();
});

/* ── Keyboard ─── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

/* ── Init ─── */
window.addEventListener('DOMContentLoaded', () => {
  loadState();

  const titleEl = document.getElementById('dashboard-title');
  if (state.title) titleEl.value = state.title;

  const logoEl = document.getElementById('logo-placeholder');
  logoEl.textContent = (state.title || 'AI').substring(0, 2).toUpperCase();

  setTimeout(() => {
    const loading = document.getElementById('loading-screen');
    loading.classList.add('hidden');
    setTimeout(() => {
      loading.remove();
      const app = document.getElementById('app');
      app.classList.add('visible');
      render();
    }, 400);
  }, 700);
});
</script>
