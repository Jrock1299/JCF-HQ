<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Ops Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fascinate&family=Ranchers&family=Annie+Use+Your+Telescope&display=swap" rel="stylesheet">
<style>
/* ── CSS Custom Properties ── */
:root {
  --color-bg: #faf7f2;
  --color-card-bg: #ffffff;
  --color-accent: #c2703e;
  --color-accent-alt: #7c8c5e;
  --color-text: #3d3028;
  --color-text-muted: #8b7d6b;
  --color-border: #e8ddd0;
  --color-alert: #c23e3e;
  --color-alert-glow: rgba(194, 62, 62, 0.18);
  --color-warning: #c2a03e;
  --font-display: 'Fascinate', cursive;
  --font-heading: 'Ranchers', cursive;
  --font-body: 'Annie Use Your Telescope', cursive;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --shadow-sm: 0 2px 8px rgba(61,48,40,0.07);
  --shadow-md: 0 4px 20px rgba(61,48,40,0.1);
  --shadow-lg: 0 8px 32px rgba(61,48,40,0.13);
  --transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
}

/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--color-bg);
  color: var(--color-text);
  min-height: 100vh;
  line-height: 1.6;
}
button { cursor: pointer; font-family: var(--font-body); }
input, select, textarea { font-family: var(--font-body); }

/* ── Loading Skeleton ── */
#loading-screen {
  position: fixed; inset: 0;
  background: var(--color-bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
  transition: opacity 0.4s ease;
}
#loading-screen.fade-out { opacity: 0; pointer-events: none; }
.loader-inner {
  text-align: center;
}
.loader-logo {
  width: 56px; height: 56px;
  background: linear-gradient(135deg, var(--color-accent), var(--color-accent-alt));
  border-radius: var(--radius-md);
  margin: 0 auto 16px;
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(0.92);opacity:0.7} }
.loader-text {
  font-family: var(--font-heading);
  font-size: 1.2rem;
  color: var(--color-text-muted);
}

/* ── App Container ── */
#app {
  opacity: 0;
  transition: opacity 0.5s ease;
}
#app.visible { opacity: 1; }

/* ── Header ── */
.header {
  background: var(--color-card-bg);
  border-bottom: 1px solid var(--color-border);
  padding: 0 32px;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow-sm);
}
.header-left {
  display: flex; align-items: center; gap: 14px;
}
.brand-logo {
  width: 40px; height: 40px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--color-accent), #e8945e);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-heading);
  font-weight: 700;
  font-size: 1rem;
  color: #fff;
  cursor: pointer;
  transition: var(--transition);
  flex-shrink: 0;
  user-select: none;
  overflow: hidden;
}
.brand-logo:hover { transform: scale(1.05); box-shadow: var(--shadow-md); }
.brand-logo img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-sm); }
.title-input {
  font-family: var(--font-display);
  font-size: 1.25rem;
  font-weight: 600;
  color: var(--color-text);
  background: transparent;
  border: 1.5px solid transparent;
  border-radius: var(--radius-sm);
  padding: 4px 10px;
  outline: none;
  transition: var(--transition);
  min-width: 180px;
  max-width: 320px;
}
.title-input:hover { border-color: var(--color-border); background: var(--color-bg); }
.title-input:focus { border-color: var(--color-accent); background: var(--color-bg); }

.header-right {
  display: flex; align-items: center; gap: 12px;
}
.mode-toggle {
  display: flex; align-items: center;
  background: var(--color-bg);
  border: 1.5px solid var(--color-border);
  border-radius: 100px;
  padding: 3px;
  gap: 2px;
}
.mode-btn {
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  padding: 6px 14px;
  border: none;
  border-radius: 100px;
  background: transparent;
  color: var(--color-text-muted);
  transition: var(--transition);
}
.mode-btn.active {
  background: var(--color-accent);
  color: #fff;
  box-shadow: 0 2px 8px rgba(194,112,62,0.3);
}
.add-platform-btn {
  display: flex; align-items: center; gap: 6px;
  background: var(--color-accent-alt);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  padding: 8px 16px;
  font-size: 0.85rem;
  font-weight: 700;
  transition: var(--transition);
  white-space: nowrap;
}
.add-platform-btn:hover { background: #6a7a4e; box-shadow: var(--shadow-md); transform: translateY(-1px); }
.add-platform-btn:active { transform: translateY(0); }

/* ── Main Layout ── */
.main {
  max-width: 1440px;
  margin: 0 auto;
  padding: 32px;
}

/* ── Summary Row ── */
.summary-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 32px;
}
.summary-card {
  background: var(--color-card-bg);
  border-radius: var(--radius-lg);
  border: 1.5px solid var(--color-border);
  padding: 24px 28px;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.summary-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}
.summary-card.accent::before { background: linear-gradient(90deg, var(--color-accent), #e8945e); }
.summary-card.alt::before { background: linear-gradient(90deg, var(--color-accent-alt), #a4b87a); }
.summary-card.warm::before { background: linear-gradient(90deg, #c2a03e, #e8c45e); }
.summary-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.summary-label {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-text-muted);
  margin-bottom: 8px;
}
.summary-value {
  font-family: var(--font-heading);
  font-size: 2.4rem;
  font-weight: 700;
  color: var(--color-text);
  line-height: 1;
  margin-bottom: 6px;
}
.summary-sub {
  font-size: 14px;
  color: var(--color-text-muted);
}
.summary-icon {
  position: absolute;
  right: 24px; top: 50%;
  transform: translateY(-50%);
  font-size: 2.5rem;
  opacity: 0.12;
}

/* ── Section Title ── */
.section-title {
  font-family: var(--font-heading);
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--color-text);
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--color-border);
}

/* ── Platform Cards Grid ── */
.platforms-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}

/* ── Platform Card ── */
.platform-card {
  background: var(--color-card-bg);
  border-radius: var(--radius-lg);
  border: 1.5px solid var(--color-border);
  padding: 22px 24px;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
  position: relative;
  overflow: hidden;
  animation: cardIn 0.4s ease both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.platform-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.platform-card.alert-state {
  border-color: var(--color-alert);
  box-shadow: 0 0 0 3px var(--color-alert-glow), var(--shadow-md);
  animation: glowPulse 2s ease-in-out infinite;
}
@keyframes glowPulse {
  0%,100%{ box-shadow: 0 0 0 3px var(--color-alert-glow), var(--shadow-md); }
  50%{ box-shadow: 0 0 0 6px rgba(194,62,62,0.1), var(--shadow-md); }
}

.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.platform-info { display: flex; align-items: center; gap: 12px; }
.platform-icon {
  width: 42px; height: 42px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
}
.platform-name {
  font-family: var(--font-heading);
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--color-text);
}
.platform-type {
  font-size: 13px;
  color: var(--color-text-muted);
  font-weight: 400;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.card-actions {
  display: flex; gap: 6px;
}
.card-btn {
  width: 30px; height: 30px;
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-bg);
  color: var(--color-text-muted);
  font-size: 0.85rem;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.card-btn:hover { border-color: var(--color-accent); color: var(--color-accent); background: #fff; }
.card-btn.delete-btn:hover { border-color: var(--color-alert); color: var(--color-alert); }

/* ── Subscription Mode ── */
.sub-mode { display: none; }
.sub-mode.visible { display: block; }
.cost-row {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 10px;
}
.cost-value {
  font-family: var(--font-heading);
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--color-text);
}
.cost-budget {
  font-size: 14px;
  color: var(--color-text-muted);
}

/* ── Token Mode ── */
.token-mode { display: none; }
.token-mode.visible { display: block; }
.token-fields {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin-bottom: 10px;
}
.token-field {
  background: var(--color-bg);
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  display: flex; flex-direction: column; gap: 2px;
}
.token-field label {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--color-text-muted);
}
.token-field input {
  background: transparent;
  border: none;
  outline: none;
  font-size: 0.9rem;
  color: var(--color-text);
  font-weight: 700;
  width: 100%;
}
.token-cost-display {
  font-size: 0.82rem;
  color: var(--color-text-muted);
  margin-bottom: 10px;
}
.token-cost-display span {
  color: var(--color-accent);
  font-weight: 700;
}

/* ── Usage Bar ── */
.usage-bar-container { margin-bottom: 8px; }
.usage-bar-labels {
  display: flex; justify-content: space-between;
  font-size: 13px; color: var(--color-text-muted);
  margin-bottom: 5px;
}
.usage-bar-track {
  height: 8px;
  background: var(--color-bg);
  border-radius: 100px;
  border: 1px solid var(--color-border);
  overflow: hidden;
}
.usage-bar-fill {
  height: 100%;
  border-radius: 100px;
  background: linear-gradient(90deg, var(--color-accent-alt), #a4b87a);
  transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
  position: relative;
}
.usage-bar-fill.alert {
  background: linear-gradient(90deg, var(--color-alert), #e05555);
}
.usage-bar-fill.warning {
  background: linear-gradient(90deg, var(--color-warning), #e0c050);
}
.usage-pct {
  font-size: 14px;
  font-weight: 700;
  color: var(--color-text-muted);
  text-align: right;
  margin-top: 4px;
}
.usage-pct.alert-text { color: var(--color-alert); }

/* ── Alert Badge ── */
.alert-badge {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--color-alert-glow);
  color: var(--color-alert);
  font-size: 14px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 100px;
  margin-top: 8px;
  border: 1px solid rgba(194,62,62,0.25);
}

/* ── Bottom Row ── */
.bottom-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.chart-card {
  background: var(--color-card-bg);
  border-radius: var(--radius-lg);
  border: 1.5px solid var(--color-border);
  padding: 28px;
  box-shadow: var(--shadow-sm);
}
.chart-card canvas {
  display: block;
  width: 100% !important;
}

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(61,48,40,0.45);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
  padding: 20px;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--color-card-bg);
  border-radius: var(--radius-lg);
  border: 1.5px solid var(--color-border);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 480px;
  padding: 32px;
  transform: translateY(16px) scale(0.97);
  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
}
.modal-overlay.open .modal { transform: translateY(0) scale(1); }
.modal-title {
  font-family: var(--font-heading);
  font-size: 1.4rem;
  font-weight: 600;
  color: var(--color-text);
  margin-bottom: 24px;
}
.form-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 16px; margin-bottom: 20px;
}
.form-group {
  display: flex; flex-direction: column; gap: 6px;
}
.form-group.full { grid-column: 1/-1; }
.form-group label {
  font-size: 0.78rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--color-text-muted);
}
.form-group input, .form-group select {
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 0.9rem;
  color: var(--color-text);
  background: var(--color-bg);
  outline: none;
  transition: var(--transition);
}
.form-group input:focus, .form-group select:focus {
  border-color: var(--color-accent);
  background: #fff;
}
.emoji-picker {
  display: grid; grid-template-columns: repeat(8,1fr); gap: 6px;
  margin-top: 4px;
}
.emoji-opt {
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--color-border);
  background: var(--color-bg);
  font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: var(--transition);
}
.emoji-opt:hover { border-color: var(--color-accent); background: #fff; }
.emoji-opt.selected { border-color: var(--color-accent); background: rgba(194,112,62,0.08); }
.modal-actions {
  display: flex; justify-content: flex-end; gap: 10px;
}
.btn-cancel {
  background: var(--color-bg);
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 10px 20px;
  color: var(--color-text-muted);
  font-size: 0.88rem;
  font-weight: 700;
  transition: var(--transition);
}
.btn-cancel:hover { border-color: var(--color-text-muted); color: var(--color-text); }
.btn-save {
  background: var(--color-accent);
  border: none;
  border-radius: var(--radius-sm);
  padding: 10px 24px;
  color: #fff;
  font-size: 0.88rem;
  font-weight: 700;
  transition: var(--transition);
}
.btn-save:hover { background: #ad6035; box-shadow: var(--shadow-md); }

/* ── History Month Edit ── */
.history-months-grid {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 10px;
  margin-bottom: 16px;
}
.month-input-group { display: flex; flex-direction: column; gap: 4px; }
.month-input-group label { font-size: 0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color: var(--color-text-muted); }
.month-input-group input { border:1.5px solid var(--color-border); border-radius:var(--radius-sm); padding:8px 10px; font-size:0.9rem; color:var(--color-text); background:var(--color-bg); outline:none; transition:var(--transition); }
.month-input-group input:focus { border-color:var(--color-accent); background:#fff; }

/* ── Empty State ── */
.empty-state {
  grid-column: 1/-1;
  text-align: center;
  padding: 60px 20px;
  color: var(--color-text-muted);
}
.empty-state-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }
.empty-state-text { font-family: var(--font-heading); font-size: 1.1rem; margin-bottom: 8px; }
.empty-state-sub { font-size: 0.85rem; }

/* ── Responsive ── */
@media (max-width: 1024px) {
  .main { padding: 24px; }
  .summary-row { grid-template-columns: 1fr 1fr; }
  .bottom-row { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .header { padding: 0 16px; height: auto; min-height: 60px; flex-wrap: wrap; gap: 10px; padding-top: 10px; padding-bottom: 10px; }
  .header-right { width: 100%; flex-wrap: wrap; gap: 8px; }
  .main { padding: 16px; }
  .summary-row { grid-template-columns: 1fr; }
  .platforms-grid { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .title-input { font-size: 1.1rem; max-width: 180px; }
  .summary-value { font-size: 2rem; }
  .bottom-row { gap: 16px; }
}
@media (max-width: 480px) {
  .mode-toggle { width: 100%; justify-content: center; }
  .add-platform-btn { width: 100%; justify-content: center; }
  .emoji-picker { grid-template-columns: repeat(6,1fr); }
}

/* ── Colorway Switcher ── */
#cw-fab {
  position: fixed; bottom: 24px; right: 24px; z-index: 900;
  display: flex; align-items: center; gap: 8px;
  padding: 9px 18px; border-radius: 10px;
  background: var(--color-card-bg); border: 2px solid var(--color-accent);
  color: var(--color-accent); cursor: pointer;
  font-family: var(--font-body); font-size: 13px; font-weight: 700;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s ease;
}
#cw-fab:hover { background: var(--color-accent); color: white; }
#cw-panel {
  position: fixed; bottom: 76px; right: 24px; z-index: 899;
  width: 296px;
  background: var(--color-card-bg); border: 1.5px solid var(--color-border);
  border-radius: 16px; padding: 20px;
  box-shadow: var(--shadow-lg);
  transform: translateY(10px) scale(0.97); opacity: 0; pointer-events: none;
  transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
}
#cw-panel.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: all; }
.cw-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cw-title { font-family: var(--font-heading); font-size: 12px; font-weight: 700; color: var(--color-text); text-transform: uppercase; letter-spacing: 0.8px; }
.cw-close { background: none; border: none; cursor: pointer; color: var(--color-text-muted); font-size: 18px; line-height: 1; padding: 0; }
.cw-close:hover { color: var(--color-text); }
#cw-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 14px; }
.cw-swatch {
  border: 2px solid transparent; border-radius: 10px; padding: 8px 6px;
  cursor: pointer; text-align: center; background: var(--color-bg);
  transition: all 0.2s ease;
}
.cw-swatch:hover { border-color: var(--color-accent); transform: scale(1.04); }
.cw-swatch.active { border-color: var(--color-accent); }
.cw-dots { display: flex; gap: 4px; justify-content: center; margin-bottom: 5px; }
.cw-dot { width: 16px; height: 16px; border-radius: 50%; }
.cw-label { font-size: 9px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-family: var(--font-body); }
.cw-custom {
  border-top: 1.5px solid var(--color-border); padding-top: 12px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.cw-custom label { font-size: 10px; color: var(--color-text-muted); font-family: var(--font-body); white-space: nowrap; }
.cw-custom input[type="color"] { width: 30px; height: 26px; border: 1.5px solid var(--color-border); border-radius: 6px; background: none; cursor: pointer; padding: 1px; }
.cw-apply { flex: 1; padding: 6px 10px; background: var(--color-accent); color: white; border: none; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: var(--font-body); transition: opacity 0.2s; }
.cw-apply:hover { opacity: 0.85; }

/* ── Tooltip ── */
.chart-tooltip {
  position: absolute;
  background: var(--color-text);
  color: #fff;
  font-size: 0.78rem;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  pointer-events: none;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 200;
}

/* ── History Edit Button ── */
.edit-history-btn {
  margin-left: auto;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--color-accent);
  background: transparent;
  border: 1.5px solid var(--color-accent);
  border-radius: var(--radius-sm);
  padding: 4px 10px;
  cursor: pointer;
  transition: var(--transition);
}
.edit-history-btn:hover { background: var(--color-accent); color: #fff; }

/* ── Inline Edit for budget ── */
.inline-edit { display: flex; align-items: center; gap: 4px; }
.inline-input {
  background: var(--color-bg);
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 2px 8px;
  font-size: 0.88rem;
  color: var(--color-text);
  outline: none;
  width: 80px;
}
.inline-input:focus { border-color: var(--color-accent); }
</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loading-screen">
  <div class="loader-inner">
    <div class="loader-logo"></div>
    <div class="loader-text">Loading AI Ops Dashboard…</div>
  </div>
</div>

<!-- App -->
<div id="app">

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="brand-logo" id="brandLogo" title="Click to upload logo">AI</div>
      <input type="file" id="logoUpload" accept="image/*" style="display:none">
      <input class="title-input" id="dashTitle" type="text" value="AI Ops Dashboard" spellcheck="false">
    </div>
    <div class="header-right">
      <div class="mode-toggle">
        <button class="mode-btn active" id="subModeBtn" onclick="setMode('subscription')">Subscription</button>
        <button class="mode-btn" id="tokenModeBtn" onclick="setMode('token')">Token API</button>
      </div>
      <button class="add-platform-btn" onclick="openAddModal()">＋ Add Platform</button>
    </div>
  </header>

  <main class="main">

    <!-- Summary Cards -->
    <div class="summary-row">
      <div class="summary-card accent">
        <div class="summary-label">Total Monthly Spend</div>
        <div class="summary-value" id="totalSpend">$0.00</div>
        <div class="summary-sub" id="totalSub">across all platforms</div>
        <div class="summary-icon">💸</div>
      </div>
      <div class="summary-card alt">
        <div class="summary-label">Total Budget</div>
        <div class="summary-value" id="totalBudget">$0.00</div>
        <div class="summary-sub" id="budgetSub">monthly limit</div>
        <div class="summary-icon">🎯</div>
      </div>
      <div class="summary-card warm">
        <div class="summary-label">Projected Month End</div>
        <div class="summary-value" id="projectedSpend">$0.00</div>
        <div class="summary-sub" id="projectedSub">based on current pace</div>
        <div class="summary-icon">📈</div>
      </div>
    </div>

    <!-- Platform Cards -->
    <div class="section-title">AI Platforms</div>
    <div class="platforms-grid" id="platformsGrid"></div>

    <!-- Bottom Row: Chart + History -->
    <div class="bottom-row">
      <div class="chart-card">
        <div class="section-title" style="margin-bottom:24px;">
          Monthly Spend History
          <button class="edit-history-btn" onclick="openHistoryModal()">Edit Data</button>
        </div>
        <div style="position:relative;">
          <canvas id="historyChart" height="300"></canvas>
          <div class="chart-tooltip" id="chartTooltip"></div>
        </div>
      </div>
      <div class="chart-card">
        <div class="section-title" style="margin-bottom:24px;">Platform Breakdown</div>
        <div style="position:relative;">
          <canvas id="breakdownChart" height="300"></canvas>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- Add/Edit Platform Modal -->
<div class="modal-overlay" id="platformModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Add Platform</div>
    <div class="form-grid">
      <div class="form-group full">
        <label>Platform Name</label>
        <input type="text" id="inputName" placeholder="e.g. Claude">
      </div>
      <div class="form-group">
        <label>Monthly Budget ($)</label>
        <input type="number" id="inputBudget" placeholder="50" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label>Current Usage ($)</label>
        <input type="number" id="inputUsage" placeholder="0" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label>Token Cost ($/1K)</label>
        <input type="number" id="inputTokenCost" placeholder="0.003" min="0" step="0.0001">
      </div>
      <div class="form-group">
        <label>Tokens Used (K)</label>
        <input type="number" id="inputTokensUsed" placeholder="0" min="0" step="0.01">
      </div>
      <div class="form-group full">
        <label>Category</label>
        <select id="inputCategory">
          <option value="Language Model">Language Model</option>
          <option value="Image Generation">Image Generation</option>
          <option value="Voice / Audio">Voice / Audio</option>
          <option value="Search / Research">Search / Research</option>
          <option value="Multimodal">Multimodal</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group full">
        <label>Icon</label>
        <div class="emoji-picker" id="emojiPicker"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="savePlatform()">Save Platform</button>
    </div>
  </div>
</div>

<!-- History Edit Modal -->
<div class="modal-overlay" id="historyModal">
  <div class="modal">
    <div class="modal-title">Edit Monthly History</div>
    <div class="history-months-grid" id="historyInputGrid"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeHistoryModal()">Cancel</button>
      <button class="btn-save" onclick="saveHistory()">Save History</button>
    </div>
  </div>
</div>

<!-- Colorway Switcher -->
<button id="cw-fab" onclick="toggleColorwayPanel()">🎨 Themes</button>
<div id="cw-panel">
  <div class="cw-header">
    <span class="cw-title">Color Theme</span>
    <button class="cw-close" onclick="toggleColorwayPanel()">✕</button>
  </div>
  <div id="cw-grid"></div>
  <div class="cw-custom">
    <label>Custom accent:</label>
    <input type="color" id="cw-accent-pick" value="#c2703e">
    <button class="cw-apply" onclick="applyCustomColorway()">SET</button>
  </div>
</div>

<script>
/* ── Constants & State ── */
const STORAGE_KEY = 'aiops_earthy_v1';
const EMOJIS = ['🤖','🧠','✨','⚡','🌊','🎨','🎵','🔮','🦾','💡','🌿','🔥','🌸','📊','🚀','🎯','💬','🖼️','🔬','🌐'];
const ICON_COLORS = ['#f0e6d3','#dde9d0','#e3d7f0','#d0e3e9','#f0d7d7','#f0ecd0','#d7e9f0','#e9d7f0'];
let currentMode = 'subscription';
let editingId = null;
let selectedEmoji = '🤖';

let state = {
  title: 'AI Ops Dashboard',
  platforms: [],
  history: [],
  logoData: null
};

/* ── Default Platforms ── */
const defaultPlatforms = [
  { id: uid(), name: 'Claude', icon: '🧠', color: '#f0e6d3', category: 'Language Model', budget: 100, usage: 42, tokenCost: 0.003, tokensUsed: 14000 },
  { id: uid(), name: 'ChatGPT', icon: '🤖', color: '#dde9d0', category: 'Language Model', budget: 80, usage: 67, tokenCost: 0.002, tokensUsed: 33500 },
  { id: uid(), name: 'Gemini', icon: '✨', color: '#e3d7f0', category: 'Multimodal', budget: 60, usage: 51, tokenCost: 0.001, tokensUsed: 51000 },
  { id: uid(), name: 'Grok', icon: '⚡', color: '#d0e3e9', category: 'Language Model', budget: 50, usage: 12, tokenCost: 0.002, tokensUsed: 6000 },
  { id: uid(), name: 'Perplexity', icon: '🔮', color: '#f0d7d7', category: 'Search / Research', budget: 40, usage: 38, tokenCost: 0.0015, tokensUsed: 25333 },
  { id: uid(), name: 'Midjourney', icon: '🎨', color: '#f0ecd0', category: 'Image Generation', budget: 120, usage: 96, tokenCost: 0, tokensUsed: 0 },
  { id: uid(), name: 'ElevenLabs', icon: '🎵', color: '#d7e9f0', category: 'Voice / Audio', budget: 30, usage: 28, tokenCost: 0.005, tokensUsed: 5600 },
];

const defaultHistory = [
  { month: 'Nov', total: 198 },
  { month: 'Dec', total: 244 },
  { month: 'Jan', total: 211 },
  { month: 'Feb', total: 287 },
  { month: 'Mar', total: 312 },
  { month: 'Apr', total: 0 },
];

/* ── Utility ── */
function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }
function fmt(n) { return '$' + (+n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function pct(used, budget) { return budget > 0 ? Math.min(100, (used/budget)*100) : 0; }

/* ── Storage ── */
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = { ...state, ...parsed };
      // Schema check: platforms must have 'usage' field (earthy schema).
      // A mismatch means data was written by a different theme (e.g. dark_techy
      // uses inputCostPer1k/inputTokens instead of usage/tokenCost/tokensUsed).
      if (!state.platforms || state.platforms.length === 0 ||
          state.platforms[0].usage === undefined) {
        state.platforms = defaultPlatforms;
      }
      // Schema check: history entries must have 'total' field (not 'amount').
      if (!state.history || state.history.length === 0 ||
          state.history[0].total === undefined) {
        state.history = defaultHistory;
      }
    } else {
      state.platforms = defaultPlatforms;
      state.history = defaultHistory;
    }
  } catch(e) {
    state.platforms = defaultPlatforms;
    state.history = defaultHistory;
  }
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {
    // localStorage unavailable (private mode, security restriction, quota exceeded)
  }
}

/* ── Mode ── */
function setMode(mode) {
  currentMode = mode;
  document.getElementById('subModeBtn').classList.toggle('active', mode === 'subscription');
  document.getElementById('tokenModeBtn').classList.toggle('active', mode === 'token');
  renderPlatforms();
  updateSummary();
}

/* ── Render Platforms ── */
function renderPlatforms() {
  const grid = document.getElementById('platformsGrid');
  if (state.platforms.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">🛸</div>
      <div class="empty-state-text">No platforms yet</div>
      <div class="empty-state-sub">Click "Add Platform" to get started</div>
    </div>`;
    return;
  }
  grid.innerHTML = state.platforms.map((p, i) => {
    const spent = getSpent(p);
    const p_pct = pct(spent, p.budget);
    const isAlert = p_pct >= 80;
    const isWarning = p_pct >= 60 && p_pct < 80;
    const barClass = isAlert ? 'alert' : isWarning ? 'warning' : '';
    const cardClass = isAlert ? 'platform-card alert-state' : 'platform-card';
    const animDelay = `animation-delay:${i*0.06}s`;

    const subHTML = `<div class="sub-mode ${currentMode==='subscription'?'visible':''}">
      <div class="cost-row">
        <div class="cost-value">${fmt(spent)}</div>
        <div class="cost-budget">of ${fmt(p.budget)}/mo</div>
      </div>
    </div>`;

    const tokenCost = (p.tokenCost||0) * (p.tokensUsed||0) / 1000;
    const tokenHTML = `<div class="token-mode ${currentMode==='token'?'visible':''}">
      <div class="token-fields">
        <div class="token-field">
          <label>$/1K Tokens</label>
          <input type="number" value="${p.tokenCost||0}" step="0.0001" min="0" 
            onchange="updateTokenField('${p.id}','tokenCost',this.value)" 
            onclick="this.select()">
        </div>
        <div class="token-field">
          <label>Tokens Used (K)</label>
          <input type="number" value="${p.tokensUsed||0}" step="1" min="0"
            onchange="updateTokenField('${p.id}','tokensUsed',this.value)"
            onclick="this.select()">
        </div>
      </div>
      <div class="token-cost-display">Token cost: <span>${fmt(tokenCost)}</span> &nbsp;|&nbsp; Budget: ${fmt(p.budget)}</div>
    </div>`;

    return `<div class="${cardClass}" style="${animDelay}" data-id="${p.id}">
      <div class="card-header">
        <div class="platform-info">
          <div class="platform-icon" style="background:${p.color||'#f0e6d3'}">${p.icon||'🤖'}</div>
          <div>
            <div class="platform-name">${p.name}</div>
            <div class="platform-type">${p.category||''}</div>
          </div>
        </div>
        <div class="card-actions">
          <button class="card-btn" onclick="openEditModal('${p.id}')" title="Edit">✎</button>
          <button class="card-btn delete-btn" onclick="deletePlatform('${p.id}')" title="Delete">✕</button>
        </div>
      </div>
      ${subHTML}
      ${tokenHTML}
      <div class="usage-bar-container">
        <div class="usage-bar-labels">
          <span>Usage</span>
          <span>${fmt(spent)} / ${fmt(p.budget)}</span>
        </div>
        <div class="usage-bar-track">
          <div class="usage-bar-fill ${barClass}" style="width:0%" data-target="${p_pct}"></div>
        </div>
        <div class="usage-pct ${isAlert?'alert-text':''}">${p_pct.toFixed(1)}%</div>
      </div>
      ${isAlert ? '<div class="alert-badge">⚠ Over 80% — Budget Alert!</div>' : ''}
    </div>`;
  }).join('');

  // Animate bars after render
  requestAnimationFrame(() => {
    document.querySelectorAll('.usage-bar-fill[data-target]').forEach(bar => {
      const target = parseFloat(bar.dataset.target);
      setTimeout(() => { bar.style.width = target + '%'; }, 50);
    });
  });
}

function getSpent(p) {
  if (currentMode === 'token') {
    return (p.tokenCost||0) * (p.tokensUsed||0) / 1000;
  }
  return p.usage || 0;
}

function updateTokenField(id, field, val) {
  const p = state.platforms.find(x=>x.id===id);
  if (!p) return;
  p[field] = parseFloat(val) || 0;
  saveState();
  renderPlatforms();
  updateSummary();
  drawBreakdownChart();
}

/* ── Summary ── */
function updateSummary() {
  const totalSpent = state.platforms.reduce((s,p) => s+getSpent(p), 0);
  const totalBudget = state.platforms.reduce((s,p) => s+(p.budget||0), 0);

  // Days projection
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const dayOfMonth = now.getDate();
  const projected = dayOfMonth > 0 ? (totalSpent / dayOfMonth) * daysInMonth : totalSpent;

  document.getElementById('totalSpend').textContent = fmt(totalSpent);
  document.getElementById('totalSub').textContent = `across ${state.platforms.length} platform${state.platforms.length!==1?'s':''}`;
  document.getElementById('totalBudget').textContent = fmt(totalBudget);
  document.getElementById('budgetSub').textContent = totalBudget > 0 ? `${((totalSpent/totalBudget)*100).toFixed(1)}% utilized` : 'no budget set';
  document.getElementById('projectedSpend').textContent = fmt(projected);
  document.getElementById('projectedSub').textContent = `Day ${dayOfMonth} of ${daysInMonth} — ${daysInMonth-dayOfMonth} days remaining`;

  // Update history current month
  if (state.history.length > 0) {
    state.history[state.history.length-1].total = parseFloat(totalSpent.toFixed(2));
    saveState();
    drawHistoryChart();
  }
}

/* ── CRUD ── */
function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Add Platform';
  document.getElementById('inputName').value = '';
  document.getElementById('inputBudget').value = '';
  document.getElementById('inputUsage').value = '';
  document.getElementById('inputTokenCost').value = '';
  document.getElementById('inputTokensUsed').value = '';
  document.getElementById('inputCategory').value = 'Language Model';
  selectedEmoji = '🤖';
  renderEmojiPicker();
  openModal('platformModal');
}

function openEditModal(id) {
  editingId = id;
  const p = state.platforms.find(x=>x.id===id);
  if (!p) return;
  document.getElementById('modalTitle').textContent = 'Edit Platform';
  document.getElementById('inputName').value = p.name;
  document.getElementById('inputBudget').value = p.budget;
  document.getElementById('inputUsage').value = p.usage;
  document.getElementById('inputTokenCost').value = p.tokenCost||0;
  document.getElementById('inputTokensUsed').value = p.tokensUsed||0;
  document.getElementById('inputCategory').value = p.category||'Language Model';
  selectedEmoji = p.icon || '🤖';
  renderEmojiPicker();
  openModal('platformModal');
}

function savePlatform() {
  const name = document.getElementById('inputName').value.trim();
  if (!name) { document.getElementById('inputName').focus(); return; }
  const budget = parseFloat(document.getElementById('inputBudget').value)||0;
  const usage = parseFloat(document.getElementById('inputUsage').value)||0;
  const tokenCost = parseFloat(document.getElementById('inputTokenCost').value)||0;
  const tokensUsed = parseFloat(document.getElementById('inputTokensUsed').value)||0;
  const category = document.getElementById('inputCategory').value;
  const color = ICON_COLORS[EMOJIS.indexOf(selectedEmoji) % ICON_COLORS.length] || '#f0e6d3';

  if (editingId) {
    const p = state.platforms.find(x=>x.id===editingId);
    if (p) Object.assign(p, { name, budget, usage, tokenCost, tokensUsed, category, icon: selectedEmoji, color });
  } else {
    state.platforms.push({ id: uid(), name, icon: selectedEmoji, color, category, budget, usage, tokenCost, tokensUsed });
  }
  saveState();
  closeModal();
  renderPlatforms();
  updateSummary();
  drawBreakdownChart();
}

function deletePlatform(id) {
  if (!confirm('Delete this platform?')) return;
  state.platforms = state.platforms.filter(x=>x.id!==id);
  saveState();
  renderPlatforms();
  updateSummary();
  drawBreakdownChart();
}

/* ── Emoji Picker ── */
function renderEmojiPicker() {
  document.getElementById('emojiPicker').innerHTML = EMOJIS.map(e =>
    `<div class="emoji-opt${e===selectedEmoji?' selected':''}" onclick="selectEmoji('${e}')">${e}</div>`
  ).join('');
}

function selectEmoji(e) {
  selectedEmoji = e;
  renderEmojiPicker();
}

/* ── Modal Controls ── */
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal() { document.getElementById('platformModal').classList.remove('open'); }
function openHistoryModal() {
  const grid = document.getElementById('historyInputGrid');
  grid.innerHTML = state.history.map((h,i) =>
    `<div class="month-input-group">
      <label>${h.month}</label>
      <input type="number" value="${h.total}" min="0" step="0.01" data-idx="${i}">
    </div>`
  ).join('');
  openModal('historyModal');
}
function closeHistoryModal() { document.getElementById('historyModal').classList.remove('open'); }
function saveHistory() {
  document.querySelectorAll('#historyInputGrid input').forEach(inp => {
    const idx = parseInt(inp.dataset.idx);
    state.history[idx].total = parseFloat(inp.value)||0;
  });
  saveState();
  drawHistoryChart();
  closeHistoryModal();
}

// Close modals on overlay click
document.getElementById('platformModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeModal(); });
document.getElementById('historyModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeHistoryModal(); });

/* ── Title Edit ── */
document.getElementById('dashTitle').addEventListener('input', e => {
  state.title = e.target.value;
  saveState();
});

/* ── Logo Upload ── */
document.getElementById('brandLogo').addEventListener('click', () => {
  document.getElementById('logoUpload').click();
});
document.getElementById('logoUpload').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    state.logoData = ev.target.result;
    saveState();
    renderLogo();
  };
  reader.readAsDataURL(file);
});

function renderLogo() {
  const logo = document.getElementById('brandLogo');
  if (state.logoData) {
    logo.innerHTML = `<img src="${state.logoData}" alt="logo">`;
  } else {
    logo.textContent = 'AI';
  }
}

/* ── History Chart (Canvas) ── */
function drawHistoryChart() {
  const canvas = document.getElementById('historyChart');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 300 * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = '300px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = rect.width, H = 300;

  const data = state.history;
  const maxVal = Math.max(...data.map(d=>d.total), 1);
  const padLeft = 56, padRight = 16, padTop = 24, padBottom = 50;
  const chartW = W - padLeft - padRight;
  const chartH = H - padTop - padBottom;

  ctx.clearRect(0,0,W,H);

  // Grid lines
  ctx.strokeStyle = '#e8ddd0';
  ctx.lineWidth = 1;
  for (let i=0;i<=4;i++) {
    const y = padTop + (chartH/4)*i;
    ctx.beginPath(); ctx.moveTo(padLeft,y); ctx.lineTo(W-padRight,y); ctx.stroke();
    ctx.fillStyle = '#8b7d6b';
    ctx.font = '14px Annie Use Your Telescope';
    ctx.textAlign = 'right';
    ctx.fillText('$'+ Math.round(maxVal*(1-i/4)), padLeft-6, y+4);
  }

  const barW = Math.min((chartW/data.length)*0.55, 48);
  const gap = chartW/data.length;

  data.forEach((d,i) => {
    const x = padLeft + gap*i + gap/2;
    const barH = (d.total/maxVal)*chartH;
    const y = padTop + chartH - barH;
    const isLast = i === data.length-1;

    // Bar gradient
    const grad = ctx.createLinearGradient(0, y, 0, padTop+chartH);
    grad.addColorStop(0, isLast ? '#c2703e' : '#7c8c5e');
    grad.addColorStop(1, isLast ? 'rgba(194,112,62,0.3)' : 'rgba(124,140,94,0.3)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    roundRect(ctx, x - barW/2, y, barW, barH, 4);
    ctx.fill();

    // Label
    ctx.fillStyle = '#8b7d6b';
    ctx.font = '14px Annie Use Your Telescope';
    ctx.textAlign = 'center';
    ctx.fillText(d.month, x, H - padBottom + 18);

    // Value on bar
    if (d.total > 0) {
      ctx.fillStyle = isLast ? '#c2703e' : '#7c8c5e';
      ctx.font = 'bold 16px Annie Use Your Telescope';
      ctx.fillText('$'+d.total.toFixed(0), x, y-5);
    }
  });

  // Tooltip
  canvas.onmousemove = function(e) {
    const bcr = canvas.getBoundingClientRect();
    const mx = e.clientX - bcr.left;
    const my = e.clientY - bcr.top;
    let found = null;
    data.forEach((d,i) => {
      const x = padLeft + gap*i + gap/2;
      if (Math.abs(mx-x) < barW/2+4) found = {d,x,i};
    });
    const tt = document.getElementById('chartTooltip');
    if (found) {
      tt.style.opacity = '1';
      tt.style.left = (found.x - 40) + 'px';
      tt.style.top = '0px';
      tt.textContent = found.d.month + ': $' + found.d.total.toFixed(2);
    } else {
      tt.style.opacity = '0';
    }
  };
  canvas.onmouseleave = () => { document.getElementById('chartTooltip').style.opacity = '0'; };
}

/* ── Breakdown Donut Chart ── */
function drawBreakdownChart() {
  const canvas = document.getElementById('breakdownChart');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 300 * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = '300px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const W = rect.width, H = 300;
  ctx.clearRect(0,0,W,H);

  const platforms = state.platforms.filter(p=>getSpent(p)>0);
  if (platforms.length === 0) {
    ctx.fillStyle = '#8b7d6b';
    ctx.font = '14px Annie Use Your Telescope';
    ctx.textAlign = 'center';
    ctx.fillText('No spend data yet', W/2, H/2);
    return;
  }
  const total = platforms.reduce((s,p)=>s+getSpent(p),0);
  const PALETTE = ['#c2703e','#7c8c5e','#c2a03e','#7c8c9e','#c23e6e','#3e8c7c','#6e3ec2','#c23e3e'];
  const cx = W/2 - 30, cy = H/2, r = Math.min(H/2-20, W/3-10), ir = r*0.58;

  let angle = -Math.PI/2;
  platforms.forEach((p,i) => {
    const slice = (getSpent(p)/total) * Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,angle,angle+slice);
    ctx.closePath();
    ctx.fillStyle = PALETTE[i%PALETTE.length];
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.stroke();
    angle += slice;
  });

  // Center hole
  ctx.beginPath(); ctx.arc(cx,cy,ir,0,Math.PI*2);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.fillStyle = '#3d3028';
  ctx.font = 'bold 24px Annie Use Your Telescope';
  ctx.textAlign = 'center';
  ctx.fillText('$'+total.toFixed(0), cx, cy+8);
  ctx.fillStyle = '#8b7d6b';
  ctx.font = '14px Annie Use Your Telescope';
  ctx.fillText('total', cx, cy+28);

  // Legend
  const legX = W - (W < 300 ? 90 : 110);
  const legStartY = Math.max(12, cy - platforms.length*18);
  platforms.forEach((p,i) => {
    const ly = legStartY + i*26;
    ctx.fillStyle = PALETTE[i%PALETTE.length];
    roundRect(ctx, legX, ly, 12, 12, 3);
    ctx.fill();
    ctx.fillStyle = '#3d3028';
    ctx.font = '15px Annie Use Your Telescope';
    ctx.textAlign = 'left';
    const label = p.name.length > 9 ? p.name.substr(0,9)+'…' : p.name;
    ctx.fillText(label, legX+16, ly+11);
    ctx.fillStyle = '#8b7d6b';
    ctx.font = '15px Annie Use Your Telescope';
    ctx.textAlign = 'right';
    ctx.fillText('$'+getSpent(p).toFixed(0), W-4, ly+11);
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

/* ── Colorway Switcher ── */
const COLORWAY_KEY = 'aiops_earthy_v2';
const COLORWAYS_EARTHY = [
  { name: 'Terracotta', bg: '#faf7f2', card: '#ffffff', accent: '#c2703e', accentAlt: '#7c8c5e', border: '#e8ddd0', text: '#3d3028', muted: '#8b7d6b' },
  { name: 'Sage',       bg: '#f5f5f0', card: '#fafafa', accent: '#7c8c5e', accentAlt: '#5e7c6e', border: '#dde5d5', text: '#2d3525', muted: '#6a7a5a' },
  { name: 'Dusty Rose', bg: '#faf5f5', card: '#fff8f8', accent: '#c08b8b', accentAlt: '#8b6060', border: '#e8d5d5', text: '#3d2828', muted: '#8b6d6d' },
  { name: 'Warm Gold',  bg: '#faf8f0', card: '#fdfaf0', accent: '#b8860b', accentAlt: '#8c6020', border: '#e8e0c0', text: '#3d3018', muted: '#8b7a4a' },
  { name: 'Ocean',      bg: '#f0f5f5', card: '#f8fafa', accent: '#5f8a8b', accentAlt: '#3a6a6a', border: '#d0e0e0', text: '#203030', muted: '#5a7a7a' },
  { name: 'Lavender',   bg: '#f5f0fa', card: '#faf8fc', accent: '#8b7cb5', accentAlt: '#6a5a90', border: '#e0d8f0', text: '#2a2035', muted: '#7a6a8a' },
];

function toggleColorwayPanel() {
  document.getElementById('cw-panel').classList.toggle('open');
}

function applyColorway(cw, idx, save) {
  const r = document.documentElement;
  r.style.setProperty('--color-bg', cw.bg);
  r.style.setProperty('--color-card-bg', cw.card);
  r.style.setProperty('--color-accent', cw.accent);
  r.style.setProperty('--color-accent-alt', cw.accentAlt);
  r.style.setProperty('--color-border', cw.border);
  r.style.setProperty('--color-text', cw.text);
  r.style.setProperty('--color-text-muted', cw.muted);
  document.querySelectorAll('.cw-swatch').forEach((s, i) => s.classList.toggle('active', i === idx));
  if (save !== false) try { localStorage.setItem(COLORWAY_KEY, idx); } catch(e) {}
  setTimeout(() => { try { drawHistoryChart(); drawBreakdownChart(); } catch(e) {} }, 100);
}

function applyCustomColorway() {
  const accent = document.getElementById('cw-accent-pick').value;
  const [rv,gv,bv] = [parseInt(accent.slice(1,3),16), parseInt(accent.slice(3,5),16), parseInt(accent.slice(5,7),16)];
  const bg = '#' + [Math.min(255,245+Math.round(rv*0.04)), Math.min(255,243+Math.round(gv*0.03)), Math.min(255,238+Math.round(bv*0.02))].map(v => v.toString(16).padStart(2,'0')).join('');
  const border = '#' + [Math.min(255,228+Math.round(rv*0.04)), Math.min(255,218+Math.round(gv*0.03)), Math.min(255,205+Math.round(bv*0.02))].map(v => v.toString(16).padStart(2,'0')).join('');
  const r = document.documentElement;
  r.style.setProperty('--color-bg', bg);
  r.style.setProperty('--color-card-bg', '#ffffff');
  r.style.setProperty('--color-accent', accent);
  r.style.setProperty('--color-accent-alt', accent);
  r.style.setProperty('--color-border', border);
  document.querySelectorAll('.cw-swatch').forEach(s => s.classList.remove('active'));
  try { localStorage.setItem(COLORWAY_KEY, 'custom:' + accent); } catch(e) {}
  setTimeout(() => { try { drawHistoryChart(); drawBreakdownChart(); } catch(e) {} }, 100);
}

(function initColorwaySwitcher() {
  const grid = document.getElementById('cw-grid');
  COLORWAYS_EARTHY.forEach((cw, i) => {
    const s = document.createElement('div');
    s.className = 'cw-swatch' + (i === 0 ? ' active' : '');
    s.title = cw.name;
    s.innerHTML = `<div class="cw-dots"><div class="cw-dot" style="background:${cw.bg};border:1px solid #ccc"></div><div class="cw-dot" style="background:${cw.accent}"></div></div><div class="cw-label">${cw.name}</div>`;
    s.addEventListener('click', () => applyColorway(cw, i));
    grid.appendChild(s);
  });
  try {
    const saved = localStorage.getItem(COLORWAY_KEY);
    if (saved !== null) {
      if (saved.startsWith('custom:')) {
        document.getElementById('cw-accent-pick').value = saved.split(':')[1];
        applyCustomColorway();
      } else {
        const idx = parseInt(saved);
        if (!isNaN(idx) && COLORWAYS_EARTHY[idx]) applyColorway(COLORWAYS_EARTHY[idx], idx, false);
      }
    }
  } catch(e) {}
  document.addEventListener('click', e => {
    const panel = document.getElementById('cw-panel');
    const fab = document.getElementById('cw-fab');
    if (panel && panel.classList.contains('open') && !panel.contains(e.target) && fab && !fab.contains(e.target)) {
      panel.classList.remove('open');
    }
  });
})();

/* ── Resize ── */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { drawHistoryChart(); drawBreakdownChart(); }, 150);
});

/* ── Init ── */
function init() {
  // Wrap all synchronous setup in try/catch so a thrown error
  // (e.g. localStorage DOMException) can never block the fade-out below.
  try {
    loadState();
    if (state.title) document.getElementById('dashTitle').value = state.title;
    renderLogo();
    renderEmojiPicker();
    renderPlatforms();
    updateSummary();
  } catch(e) {
    console.error('[aiops] init error:', e);
  }

  // Chart draw — deferred so the layout is fully computed first.
  setTimeout(() => {
    try { drawHistoryChart(); drawBreakdownChart(); } catch(e) {}
  }, 100);

  // Loading screen removal — registered unconditionally so it always fires.
  setTimeout(() => {
    const ls  = document.getElementById('loading-screen');
    const app = document.getElementById('app');
    if (ls)  ls.classList.add('fade-out');
    if (app) app.classList.add('visible');
    setTimeout(() => { if (ls) ls.style.display = 'none'; }, 400);
  }, 500);
}

init();
</script>
